<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Register — The Archive</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body>
<div class="auth-wrapper">
  <div class="auth-box">
    <div class="auth-logo">▣ THE ARCHIVE</div>
    <div class="auth-sub">CREATE ACCOUNT // DOCUMENT VAULT ACCESS</div>

    {% if error %}
    <div class="alert alert-error">{{ error }}</div>
    {% endif %}

    <form method="POST">
      <div class="field">
        <label>USERNAME <span style="color:#5a7080">(3–20 chars)</span></label>
        <input type="text" name="username" autocomplete="off" required minlength="3" maxlength="20" />
      </div>
      <div class="field">
        <label>PASSWORD</label>
        <input type="password" name="password" required />
      </div>
      <button class="btn btn-primary" type="submit">CREATE ACCOUNT</button>
    </form>

    <div class="auth-alt">
      Already have access? <a href="{{ url_for('login') }}">LOGIN</a>
    </div>
  </div>
</div>
<div class="scan-line"></div>
</body>
</html>
