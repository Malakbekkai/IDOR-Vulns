<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile — User Vault</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body>

<nav>
  <a class="nav-brand" href="/profile">
    <span class="nav-brand-icon">◈</span>
    USER VAULT
  </a>
  <ul class="nav-links">
    <li><a href="/profile">PROFILE</a></li>
    <li><a href="/logout">LOGOUT</a></li>
  </ul>
</nav>

<main>
  <div class="page-header">
    <div class="page-title">◈ PROFILE <span>/ {{ user.username }}</span></div>
    <div class="page-subtitle">ACCOUNT INFORMATION</div>
  </div>

  <div class="profile-card">
    <div class="profile-row">
      <div class="profile-label">USER ID</div>
      <div class="profile-id">{{ user.id }}</div>
    </div>

    <hr class="divider">

    <div class="profile-row">
      <div class="profile-label">USERNAME</div>
      <div class="profile-value">{{ user.username }}</div>
    </div>

    <div class="profile-row">
      <div class="profile-label">BIO</div>
      <div class="profile-value-dim">
        {% if user.bio %}{{ user.bio }}{% else %}<span style="color:var(--text-dim)">No bio set.</span>{% endif %}
      </div>
    </div>

    <div class="profile-row">
      <div class="profile-label">ACCOUNT STATUS</div>
      <span class="badge badge-green">ACTIVE</span>
    </div>

    <hr class="divider">

    <a href="/logout" class="btn btn-danger" style="width:auto;display:inline-block;">LOGOUT</a>
  </div>
</main>

</body>
</html>
